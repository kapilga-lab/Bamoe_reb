spring.application.name=bamoe-wrapper
server.port=8081

# BAMOE business service (engine REST + data-index /graphql + management addon)
wrapper.engine.base-url=http://localhost:8080

# External userDetails API used by the RANDOM_SELECT / ROUND_ROBIN / TO_ALL_USER / CHOICE strategies
wrapper.user-details.url=http://localhost:9090/api/simulate/userDetails

# Wrapper tables (last_assignment, wrapper_task_decisions, wrapper_task_comments) — created at startup
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
spring.datasource.username=bamoe
spring.datasource.password=bamoe

# Roles (JWT Roles or group names, comma-separated) allowed to call POST /api/workflows/reassign.
# Empty = any caller with a valid JWT.
wrapper.reassign.allowed-roles=

springdoc.swagger-ui.use-root-path=true
